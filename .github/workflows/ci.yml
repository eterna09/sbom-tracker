name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sbom
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: sbom_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sbom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    valkey:
      image: valkey/valkey:8
      ports:
        - 6379:6379
    env:
      PGPASSWORD: ci-only-password
      DATABASE_URL: postgresql+psycopg://sbom:ci-only-password@localhost:5432/sbom_tracker
      TEST_DATABASE_URL: postgresql+psycopg://sbom:ci-only-password@localhost:5432/sbom_tracker_test
      TEST_REDIS_URL: redis://localhost:6379/1
      JWT_SECRET_KEY: ci-only-secret-key-that-signs-nothing-real-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Audit dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt
      - name: Create test database
        run: createdb -h localhost -U sbom sbom_tracker_test
      - name: Migration round trip
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Run tests
        run: pytest -v
