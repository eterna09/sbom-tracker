services:
  db:
    image: postgres:17
    env_file: .env
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 5
  cache:
    image: valkey/valkey:8
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  pgdata:
